
apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: hello-serving-clrev01
  annotations:
    scenarios.ai.sap.com/name: "Hello World Lab clrev01"
    scenarios.ai.sap.com/description: "Hello World training scenario rev01"
    executables.ai.sap.com/name: "Hello HTTP Serving clrev01"
    executables.ai.sap.com/description: "Deploys a greeting HTTP service rev01"
  labels:
    scenarios.ai.sap.com/id: "hello-world-clrev01"
    ai.sap.com/version: "1.0"
spec:
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      labels: |
        ai.sap.com/resourcePlan: <INFERENCE_PLAN>
    spec: |
      predictor:
        minReplicas: 1
        maxReplicas: 1
        containers:
          - name: kserve-container
            image: <APPROVED_IMAGE>
            ports:
              - containerPort: 8080
                protocol: TCP


